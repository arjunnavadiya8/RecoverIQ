[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveriq"
version = "0.1.0"
description = "Delivery-risk, causal measurement, and experimentation system for e-commerce"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "shap>=0.46,<1",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "streamlit>=1.38,<2",
  "plotly>=5.24,<7",
  "mlflow>=2.16,<4",
  "dbt-duckdb>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
recoveriq = "recoveriq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

